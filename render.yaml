services:
  - type: web
    name: entertainment-os-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./entertainment_os.db
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: TMDB_API_KEY
        sync: false
